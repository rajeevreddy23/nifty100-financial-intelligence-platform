# Nifty 100 Financial Screener Configuration
presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, low leverage, positive free cash flow, sustainable growth"
    filters:
      min_roe: 15.0
      max_de: 1.0
      min_fcf: 0.0
      min_rev_cagr_5yr: 10.0
    ranking_metric: "composite_score"
    ascending: false

  value_pick:
    name: "Value Pick"
    description: "Attractive P/E, conservative P/B, manageable debt, positive yield"
    filters:
      max_pe: 20.0
      max_pb: 3.0
      max_de: 2.0
      min_div_yield: 1.0
    ranking_metric: "fcf_yield"
    ascending: false

  growth_accelerator:
    name: "Growth Accelerator"
    description: "Rapid PAT and revenue growth with controlled debt"
    filters:
      min_pat_cagr_5yr: 20.0
      min_rev_cagr_5yr: 15.0
      max_de: 2.0
    ranking_metric: "pat_cagr_5yr"
    ascending: false

  dividend_champion:
    name: "Dividend Champion"
    description: "High dividend yield, healthy payout ratio, positive free cash flow"
    filters:
      min_div_yield: 2.0
      max_payout_ratio: 80.0
      min_fcf: 0.0
    ranking_metric: "dividend_yield_pct"
    ascending: false

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt, solid ROE, scale (> 5000 Cr revenue)"
    filters:
      max_de: 0.0
      min_roe: 12.0
      min_sales: 5000.0
    ranking_metric: "return_on_equity_pct"
    ascending: false

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Accelerating 3yr revenue CAGR, positive latest FCF, improving balance sheet"
    filters:
      min_rev_cagr_3yr: 10.0
      min_fcf: 0.0
      max_de: 2.5
    ranking_metric: "revenue_cagr_3yr"
    ascending: false

composite_weights:
  profitability: 0.35
  cash_quality: 0.30
  growth: 0.20
  leverage: 0.15
